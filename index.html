<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanna Zubchenko · Product Designer</title>
  <meta name="description" content="Hanna Zubchenko, product designer working on spatial UX, digital twins and AI for enterprise IT.">
  <script>
    // Apply saved theme before first paint (no flash). "system" follows the device.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=202611221802">
</head>
<body class="is-landing">
  <div class="page">
    <header class="nav">
      <a href="./" class="nav__item">Hanna Zubchenko</a>
      <a href="#about" class="nav__item">About</a>
      <a href="#contact" class="nav__item">Contact</a>
      <div class="theme" role="group" aria-label="Colour theme">
        <button type="button" data-theme-set="light">Light</button>
        <button type="button" data-theme-set="dark">Dark</button>
        <button type="button" data-theme-set="system">System</button>
      </div>
    </header>

    <main class="work">
      <a href="workspace-advisor.html" class="tile tile--feature">
        <span class="tile__label">Cisco Workspace Advisor</span>
        <span class="tile__media" style="--tile-bg:#d9d9d9">
          <video class="cover" autoplay muted loop playsinline preload="auto"
                 poster="assets/workspace-advisor-poster.jpg"
                 aria-label="A Cisco device scans a meeting room and rebuilds it in 3D in Control Hub">
            <source src="assets/workspace-advisor-loop.mp4" type="video/mp4">
          </video>
        </span>
      </a>

      <div class="work__side">
        <a href="#contact" class="tile">
          <span class="tile__label">Cisco Control Hub</span>
          <span class="tile__media" style="--tile-bg:#d9d9d9">
            <img src="assets/control-hub.webp" alt="Auditorium 3D model with a room status card in Control Hub" class="cover">
          </span>
        </a>

        <div class="work__pair">
          <a href="#contact" class="tile">
            <span class="tile__label">Volue Gemini Connected</span>
            <span class="tile__media" style="--tile-bg:#e9edf3">
              <img src="assets/volue-gemini.webp" alt="Construction project app showing a 3D terrain model" class="contain">
            </span>
          </a>
          <a href="#contact" class="tile">
            <span class="tile__label">Volue Wave design system</span>
            <span class="tile__media" style="--tile-bg:#ebf1f5">
              <img src="assets/volue-wave.webp" alt="Layout diagram of navigation, form and map regions" class="contain">
            </span>
          </a>
        </div>
      </div>
    </main>
  </div>
  <script src="main.js?v=202611221802" defer></script>
</body>
</html>
