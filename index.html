  <script>
    // Apply saved theme before first paint (no flash). "system" follows the device.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
    // First visit or refresh: show the loader (not when moving between pages, going back, or with reduce motion).
    (function () {
      try {
        var nav = performance.getEntriesByType('navigation')[0], type = nav ? nav.type : 'navigate';
        // Moving between pages on this site is marked just before leaving (see main.js),
        // so a fresh visit or a refresh always gets the loader, even inside a preview frame.
        var internal = false;
        try { internal = sessionStorage.getItem('hzInternal') === '1'; sessionStorage.removeItem('hzInternal'); } catch (e) {}
        var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!calm && type !== 'back_forward' && !(type === 'navigate' && internal)) document.documentElement.classList.add('boot');
      } catch (e) {}
    })();
  </script>
