<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanna Zubchenko · Product designer and design lead</title>
  <meta name="description" content="Hanna Zubchenko, product designer working on spatial UX, digital twins and AI for enterprise IT.">
  <script>
    // Apply saved theme before first paint (no flash). "system" follows the device.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
    // First visit or refresh: show the loader (not when moving between pages, going back, or with reduce motion).
    (function () {
      try {
        var nav = performance.getEntriesByType('navigation')[0], type = nav ? nav.type : 'navigate';
        var fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
        var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!calm && (type === 'reload' || (type === 'navigate' && !fromSite))) document.documentElement.classList.add('boot');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=202611271900">
</head>
<body class="is-landing">
  <div class="page">
    <header class="nav">
      <a href="./" class="nav__item">Hanna Zubchenko</a>
      <a href="about.html" class="nav__item">About</a>
      <a href="contact.html" class="nav__item">Contact</a>
      <div class="theme" role="group" aria-label="Color theme">
        <button type="button" data-theme-set="light">Light</button>
        <button type="button" data-theme-set="dark">Dark</button>
        <button type="button" data-theme-set="system">System</button>
      </div>
    </header>

    <p class="intro" data-roll>
      <span>Product designer and design lead in Oslo.</span>
      <span>I design spatial experiences that help people understand complex systems.</span>
    </p>

    <main class="work">
      <a href="workspace-advisor.html" class="tile tile--feature">
        <span class="tile__label" style="view-transition-name:workspace-advisor-title;view-transition-class:vt-title">Cisco Workspace Advisor</span>
        <span class="tile__media" style="--tile-bg:#d9d9d9;view-transition-name:workspace-advisor-media;view-transition-class:vt-media">
          <video class="cover" autoplay muted loop playsinline preload="auto"
                 poster="assets/workspace-advisor-poster.jpg"
                 aria-label="A Cisco device scans a meeting room and rebuilds it in 3D in Control Hub">
            <source src="assets/workspace-advisor-loop.mp4" type="video/mp4">
          </video>
        </span>
      </a>

      <div class="work__side">
        <a href="control-hub.html" class="tile">
          <span class="tile__label" style="view-transition-name:control-hub-title;view-transition-class:vt-title">Cisco Control Hub</span>
          <span class="tile__media" style="--tile-bg:#d9d9d9;view-transition-name:control-hub-media;view-transition-class:vt-media">
            <img src="assets/control-hub.webp" alt="Auditorium 3D model with a room status card in Control Hub" class="cover">
          </span>
        </a>

        <div class="work__pair">
          <a href="volue-gemini.html" class="tile">
            <span class="tile__label" style="view-transition-name:volue-gemini-title;view-transition-class:vt-title">Volue Gemini Connected</span>
            <span class="tile__media" style="--tile-bg:#e9edf3;view-transition-name:volue-gemini-media;view-transition-class:vt-media">
              <img src="assets/volue-gemini.webp" alt="Construction project app showing a 3D terrain model" class="contain">
            </span>
          </a>
          <a href="volue-wave.html" class="tile">
            <span class="tile__label" style="view-transition-name:volue-wave-title;view-transition-class:vt-title">Volue Wave design system</span>
            <span class="tile__media" style="--tile-bg:#ebf1f5;view-transition-name:volue-wave-media;view-transition-class:vt-media">
              <img src="assets/volue-wave.webp" alt="Layout diagram of navigation, form and map regions" class="contain">
            </span>
          </a>
        </div>
      </div>
    </main>
  </div>
  <script src="main.js?v=202611271900" defer></script>
</body>
</html>
